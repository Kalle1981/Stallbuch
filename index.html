<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Stallbuch</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#26332A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stallbuch">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-parchment:#F6F1E4; --forest-deep:#26332A; --forest-mid:#3F5240; --saddle-tan:#C79A6B;
  --chestnut:#A85C3B; --gold-ribbon:#C9A227; --ink:#21281F; --ink-soft:#5B6255;
  --cream-card:#FFFCF5; --line:#E3D9C3;
  --font-display:'Fraunces',serif; --font-body:'Manrope',sans-serif; --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--bg-parchment); font-family:var(--font-body); color:var(--ink);
  display:flex; flex-direction:column; align-items:center; min-height:100vh; min-height:100dvh;}
button{font-family:var(--font-body); cursor:pointer;}
input,textarea,select{font-family:var(--font-body);}
.phone{width:100%; max-width:100%; height:100vh; height:100dvh; background:var(--bg-parchment);
  overflow:hidden; position:relative; display:flex; flex-direction:column;}
#screen{flex:1; overflow-y:auto; padding:calc(20px + env(safe-area-inset-top)) 18px calc(92px + env(safe-area-inset-bottom));}
.hidden{display:none !important;}

/* ---- shared ---- */
.back-row{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
.back-btn{width:32px; height:32px; border-radius:50%; background:var(--cream-card); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--forest-deep);}
.page-title{font-family:var(--font-display); font-size:21px; font-weight:600; color:var(--forest-deep);}
.section-label{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-soft); margin:0 0 10px 2px;}
.card{background:var(--cream-card); border:1px solid var(--line); border-radius:16px; padding:14px;}
.btn{border:none; border-radius:12px; padding:11px 16px; font-weight:700; font-size:13px;}
.btn-primary{background:var(--forest-deep); color:#F6F1E4;}
.btn-gold{background:var(--gold-ribbon); color:#26332A;}
.btn-ghost{background:var(--cream-card); border:1px solid var(--line); color:var(--forest-deep);}
.btn-block{width:100%;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:11px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; text-transform:uppercase; letter-spacing:.05em;}
.field input,.field textarea,.field select{width:100%; border:1.5px solid var(--line); border-radius:10px; padding:9px 11px;
  font-size:13px; background:#fff; color:var(--ink);}
.field textarea{resize:vertical; min-height:56px;}
.round-photo{width:76px; height:76px; border-radius:50%; object-fit:cover; background:var(--saddle-tan);
  display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-display); font-size:24px; flex-shrink:0;}
.photo-pick{position:relative; display:inline-block;}
.photo-pick input{position:absolute; inset:0; opacity:0; cursor:pointer;}
.photo-edit-badge{position:absolute; bottom:-2px; right:-2px; width:24px; height:24px; border-radius:50%;
  background:var(--forest-deep); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; border:2px solid var(--bg-parchment);}
.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.tag{font-size:11px; font-weight:700; padding:6px 11px; border-radius:16px; border:1px solid var(--line);
  color:var(--ink-soft); background:var(--cream-card);}
.tag.on{background:var(--saddle-tan); color:#fff; border-color:var(--saddle-tan);}
.empty-hint{font-size:12px; color:var(--ink-soft); text-align:center; padding:18px 10px;}

/* ---- home ---- */
.home-header{display:flex; align-items:flex-start; gap:14px; margin-bottom:16px;}
.avatar-wrap{position:relative; flex-shrink:0; cursor:pointer;}
.avatar{width:60px; height:60px; border-radius:50%; border:3px solid var(--cream-card); object-fit:cover;
  box-shadow:0 3px 10px rgba(0,0,0,.18); background:var(--saddle-tan); display:flex; align-items:center;
  justify-content:center; color:#fff; font-family:var(--font-display); font-size:20px;}
.who{flex:1; padding-top:4px; cursor:pointer;}
.who .name{font-family:var(--font-display); font-weight:600; font-size:18px; color:var(--forest-deep); line-height:1.1;}
.who .sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.quiz-nudge{display:flex; align-items:center; gap:12px; background:var(--gold-ribbon); border-radius:16px;
  padding:12px 14px; margin-bottom:18px; cursor:pointer;}
.quiz-nudge .qn-ic{font-size:20px;}
.quiz-nudge .qn-text{flex:1;}
.quiz-nudge .qn-text b{display:block; font-size:13px; color:#26332A;}
.quiz-nudge .qn-text span{font-size:11px; color:#3f3111;}
.horses-row{display:flex; gap:12px; margin:0 0 18px; overflow-x:auto; padding-bottom:2px;}
.horse-chip{display:flex; flex-direction:column; align-items:center; gap:5px; flex-shrink:0; width:58px; cursor:pointer;}
.horse-chip .avatar{width:50px; height:50px; font-size:16px;}
.horse-chip span{font-size:10.5px; color:var(--ink-soft); font-weight:600; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:56px;}
.add-chip{width:50px; height:50px; border-radius:50%; border:2px dashed var(--saddle-tan);
  display:flex; align-items:center; justify-content:center; color:var(--saddle-tan); font-size:20px; cursor:pointer; background:none;}
.train-week-card{background:var(--cream-card); border:1px solid var(--line); border-radius:18px; padding:15px 16px; margin-bottom:16px;}
.tw-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;}
.tw-title{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:700;}
.tw-count{font-family:var(--font-mono); font-size:17px; color:var(--forest-deep); font-weight:700;}
.tw-row{display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
.tw-label{font-size:12.5px; font-weight:700; color:var(--forest-deep); width:64px; flex-shrink:0; display:flex; align-items:center; gap:5px;}
.tw-dots{display:flex; gap:5px;}
.tw-dot{width:16px; height:16px; border-radius:50%; border:1.5px solid var(--line); background:#fff;}
.tw-dot.on{background:var(--forest-mid); border-color:var(--forest-mid);}
.tw-row.warn .tw-dot.on{background:var(--chestnut); border-color:var(--chestnut);}
.tw-goal{width:100%; font-size:9.5px; color:var(--chestnut); font-weight:700; margin-left:74px;}
.tw-nudge{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);}
.tw-nudge b{display:block; font-size:12px; color:var(--forest-deep); margin-bottom:3px;}
.tw-nudge span{font-size:11px; color:var(--ink-soft); line-height:1.45;}
.reminder-banner{display:flex; gap:10px; align-items:flex-start; background:#FBE9DA; border:1px solid #EFCDA8;
  border-radius:16px; padding:12px 14px; margin-bottom:16px; cursor:pointer;}
.reminder-banner .dot{width:8px; height:8px; border-radius:50%; background:var(--chestnut); margin-top:5px; flex-shrink:0;}
.reminder-banner b{display:block; font-size:13px; color:var(--forest-deep);}
.reminder-banner span{font-size:12px; color:var(--ink-soft);}
.fn-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;}
.fn-card{background:var(--cream-card); border:1px solid var(--line); border-radius:18px; padding:16px 14px;
  display:flex; flex-direction:column; gap:22px; min-height:92px; border:1px solid var(--line);}
.fn-card .ic{font-size:22px;}
.fn-card .tt{font-weight:700; font-size:13.5px; color:var(--forest-deep);}
.fn-card .dd{font-size:11px; color:var(--ink-soft); margin-top:2px;}
.fn-card.wide{grid-column:1/-1; flex-direction:row; align-items:center; gap:14px; min-height:auto;}
.home-footer{display:flex; justify-content:center; align-items:center; gap:7px; margin-top:4px; font-size:10.5px;
  color:var(--ink-soft); text-decoration:underline; text-underline-offset:2px;}
.home-footer span{cursor:pointer;}
.home-footer .fs-dot{text-decoration:none;}

/* ---- tabs ---- */
.tab-row{display:flex; gap:7px; margin-bottom:18px; flex-wrap:wrap;}
.tab{font-size:11.5px; font-weight:700; padding:7px 12px; border-radius:20px; border:1px solid var(--line);
  color:var(--ink-soft); background:var(--cream-card);}
.tab.on{background:var(--forest-deep); color:#F6F1E4; border-color:var(--forest-deep);}

/* ---- exercises ---- */
.plan-scroll{display:flex; gap:10px; overflow-x:auto; margin-bottom:18px; padding-bottom:2px;}
.plan-chip{flex-shrink:0; min-width:118px; background:var(--cream-card); border:1.5px solid var(--line);
  border-radius:14px; padding:12px 14px;}
.plan-chip.on{border-color:var(--gold-ribbon); background:#FBF4DE;}
.plan-chip .pc-t{font-weight:700; font-size:12.5px; color:var(--forest-deep);}
.plan-chip .pc-d{font-size:10.5px; color:var(--ink-soft); margin-top:3px;}
.exercise-card{background:var(--cream-card); border:1px solid var(--line); border-radius:18px; overflow:hidden; margin-bottom:14px;}
.ex-img{height:110px; background:linear-gradient(135deg,#DCC9A3,#B98E5F); display:flex; align-items:center; justify-content:center; font-size:32px;}
.ex-body{padding:13px 15px 15px;}
.ex-title{font-weight:700; font-size:14px; color:var(--forest-deep); display:flex; justify-content:space-between; align-items:center;}
.ex-meta{font-family:var(--font-mono); font-size:10.5px; color:var(--chestnut);}
.ex-tag-mini{display:inline-block; font-family:var(--font-mono); font-size:9.5px; color:var(--forest-deep);
  background:#EAF0E7; padding:2px 7px; border-radius:6px; margin-top:6px;}
.ex-why{margin-top:8px; background:#F0ECDD; border-left:3px solid var(--saddle-tan); border-radius:6px;
  padding:8px 10px; font-size:11.5px; color:var(--ink-soft); line-height:1.45;}
.ex-why b{color:var(--forest-deep);}
.log-btn{margin-top:10px; width:100%; background:var(--forest-deep); color:#F6F1E4; border:none; border-radius:9px; padding:8px; font-size:11.5px; font-weight:700;}

.suggest-item{display:flex; align-items:center; gap:11px; background:var(--cream-card); border:1px solid var(--line);
  border-radius:12px; padding:11px 12px; margin-bottom:8px; cursor:pointer;}
.suggest-item.on{border-color:var(--forest-mid); background:#EAF0E7;}
.sug-check{width:18px; height:18px; border-radius:6px; border:1.5px solid var(--saddle-tan); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff;}
.suggest-item.on .sug-check{background:var(--forest-mid); border-color:var(--forest-mid);}
.sug-info .st{font-weight:700; font-size:12.5px; color:var(--forest-deep);}
.sug-info .sd{font-size:10.5px; color:var(--ink-soft);}
.plan-preview{background:var(--forest-deep); color:#F6F1E4; border-radius:16px; padding:14px 16px; margin-top:16px;}
.plan-preview .pp-title{font-family:var(--font-display); font-size:14px; font-weight:600; margin-bottom:6px;}
.plan-preview .pp-list{font-size:11.5px; opacity:.85; line-height:1.5; margin-bottom:10px;}

/* ---- arena ---- */
.arena-card{background:var(--forest-deep); border-radius:18px; padding:16px; color:#F6F1E4; margin-bottom:16px;}
.arena-card .tt{font-family:var(--font-display); font-size:15px; font-weight:600; margin-bottom:10px;}
.arena-grid{background:#3B4A3B; border-radius:10px; height:190px; position:relative; cursor:crosshair;
  background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 25px),
  repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, transparent 1px 25px); margin-bottom:10px; overflow:hidden;}
.obstacle{position:absolute; width:28px; height:16px; background:var(--gold-ribbon); border-radius:3px;
  box-shadow:0 2px 4px rgba(0,0,0,.3); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:9px; color:#26332A; font-weight:700; transform:translate(-50%,-50%);}
.arena-actions{display:flex; gap:8px;}
.mini-btn{flex:1; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); color:#F6F1E4;
  border-radius:10px; padding:9px; font-size:11px; font-weight:700; text-align:center; border:none;}
.mini-btn.gold{background:var(--gold-ribbon); color:#26332A;}
.arena-hint{font-size:10.5px; opacity:.7; margin-bottom:10px;}

/* ---- history ---- */
.hist-row{display:flex; align-items:center; gap:12px; background:var(--cream-card); border:1px solid var(--line);
  border-radius:14px; padding:11px 12px; margin-bottom:8px;}
.hist-ic{width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
.hist-ic.rider{background:#F3E6D6; color:var(--chestnut);}
.hist-ic.horse{background:#EAF0E7; color:var(--forest-mid);}
.hist-info{flex:1;}
.hist-info .ht{font-weight:700; font-size:12.5px; color:var(--forest-deep);}
.hist-info .hd{font-size:10.5px; color:var(--ink-soft);}
.hist-del{font-size:14px; color:var(--ink-soft); flex-shrink:0;}

/* ---- calendar ---- */
.cal-card{background:var(--cream-card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:18px;}
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.cal-head .cm{font-family:var(--font-display); font-size:15px; font-weight:600; color:var(--forest-deep);}
.cal-nav{display:flex; gap:6px;}
.cal-nav div{width:24px; height:24px; border-radius:50%; background:#F0ECDD; display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--forest-deep);}
.cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; margin-bottom:6px;}
.cal-weekdays div{font-size:9.5px; color:var(--ink-soft); font-weight:700;}
.cal-days{display:grid; grid-template-columns:repeat(7,1fr); row-gap:6px;}
.cal-day{aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:11px; color:var(--ink); border-radius:9px; position:relative; gap:2px;}
.cal-day.muted{color:#C9C2AC;}
.cal-day.today{background:var(--forest-deep); color:#F6F1E4; font-weight:700;}
.cal-day .mark{width:4px; height:4px; border-radius:50%; background:var(--chestnut);}
.cal-day.today .mark{background:var(--gold-ribbon);}
.add-termin{display:flex; align-items:center; justify-content:center; gap:6px; border:1.5px dashed var(--saddle-tan);
  border-radius:12px; padding:10px; color:var(--chestnut); font-size:12px; font-weight:700; margin-top:14px; background:none; width:100%;}
.termin-row{display:flex; align-items:center; gap:12px; background:var(--cream-card); border:1px solid var(--line);
  border-radius:14px; padding:11px 12px; margin-bottom:8px;}
.termin-date{width:42px; text-align:center; flex-shrink:0; background:#F0ECDD; border-radius:9px; padding:5px 0; font-family:var(--font-mono);}
.termin-date .dd2{font-size:14px; font-weight:700; color:var(--forest-deep); line-height:1;}
.termin-date .mm{font-size:8.5px; color:var(--ink-soft); text-transform:uppercase;}
.termin-info{flex:1;}
.termin-info .tn{font-weight:700; font-size:12.5px; color:var(--forest-deep);}
.termin-info .tr{font-size:11px; color:var(--ink-soft);}

/* ---- costs ---- */
.guide-banner{background:var(--forest-deep); color:#F6F1E4; border-radius:16px; padding:14px 16px; margin-bottom:16px;}
.guide-banner .gt{font-family:var(--font-display); font-size:15px; font-weight:600; margin-bottom:4px;}
.guide-banner .gd{font-size:11px; opacity:.8; line-height:1.4;}
.check-item{background:var(--cream-card); border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin-bottom:7px;}
.check-item-top{display:flex; align-items:center; gap:11px; cursor:pointer;}
.check-box{width:18px; height:18px; border-radius:6px; border:1.5px solid var(--saddle-tan); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff;}
.check-item.on .check-box{background:var(--forest-mid); border-color:var(--forest-mid);}
.check-item .ct{flex:1; font-size:12.5px; color:var(--ink); font-weight:600;}
.check-item.on .ct{color:var(--forest-deep); font-weight:700;}
.entry-row{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);}
.entry-row input{flex:1 1 100%; min-width:0; border:1px solid var(--line); border-radius:8px; padding:7px 9px; font-family:var(--font-mono); font-size:12px;}
.freq-toggle{display:flex; gap:5px;}
.freq-chip{font-size:9.5px; font-weight:700; padding:6px 8px; border-radius:8px; border:1px solid var(--line);
  color:var(--ink-soft); background:#fff;}
.freq-chip.on{background:var(--forest-deep); color:#F6F1E4; border-color:var(--forest-deep);}
.cost-summary{display:flex; justify-content:space-between; align-items:baseline; margin:16px 2px 10px;}
.cost-summary .cs-label{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em;}
.cost-summary .cs-val{font-family:var(--font-mono); font-size:19px; color:var(--forest-deep); font-weight:600;}
.cost-row{display:flex; align-items:center; gap:10px; background:var(--cream-card); border:1px solid var(--line);
  border-radius:12px; padding:9px 12px; margin-bottom:6px;}
.cost-row .cr-name{flex:1; font-size:12px; font-weight:600; color:var(--forest-deep);}
.cost-row .cr-val{font-family:var(--font-mono); font-size:12px; color:var(--chestnut); font-weight:700;}

/* ---- contacts ---- */
.contact-group{margin-bottom:18px;}
.group-title{font-size:10.5px; font-weight:700; color:var(--chestnut); text-transform:uppercase; letter-spacing:.08em; margin:0 0 8px 2px;}
.contact-row{display:flex; align-items:center; gap:12px; background:var(--cream-card); border:1px solid var(--line);
  border-radius:14px; padding:11px 12px; margin-bottom:8px;}
.contact-ic{width:38px; height:38px; border-radius:50%; background:var(--forest-deep); color:#F6F1E4;
  display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;}
.contact-info{flex:1; min-width:0;}
.contact-info .cn{font-weight:700; font-size:13px; color:var(--forest-deep);}
.contact-info .cr{font-size:11px; color:var(--ink-soft);}
.call-btn{width:32px; height:32px; border-radius:50%; background:#EAF0E7; border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0;}
.add-contact{display:flex; align-items:center; justify-content:center; gap:6px; border:1.5px dashed var(--saddle-tan);
  border-radius:14px; padding:12px; color:var(--chestnut); font-size:12px; font-weight:700; margin-top:4px; background:none; width:100%;}

/* ---- quiz ---- */
.quiz-hero{background:linear-gradient(135deg,var(--forest-deep),#3A4A3B); border-radius:20px; padding:18px; color:#F6F1E4; margin-bottom:18px;}
.quiz-hero .day{font-family:var(--font-mono); font-size:10.5px; opacity:.7; text-transform:uppercase; letter-spacing:.1em;}
.quiz-hero .qtitle{font-family:var(--font-display); font-size:19px; font-weight:600; margin:4px 0 12px;}
.quiz-progress-row{display:flex; gap:5px;}
.qp-dot{flex:1; height:5px; border-radius:4px; background:rgba(255,255,255,.2);}
.qp-dot.done{background:var(--gold-ribbon);}
.qcard{background:var(--cream-card); border:1px solid var(--line); border-radius:18px; padding:18px; margin-bottom:16px;}
.qcard .qn{font-family:var(--font-mono); font-size:10px; color:var(--chestnut); text-transform:uppercase; letter-spacing:.08em;}
.qcard .qtext{font-weight:700; font-size:14.5px; color:var(--forest-deep); margin:6px 0 14px; line-height:1.35;}
.opt{display:flex; align-items:center; gap:10px; padding:11px 12px; border:1.5px solid var(--line); border-radius:12px;
  margin-bottom:8px; font-size:12.5px; color:var(--ink);}
.opt.correct{border-color:var(--forest-mid); background:#EAF0E7; font-weight:700; color:var(--forest-deep);}
.opt.wrong{border-color:var(--chestnut); background:#FBE9DA;}
.opt .dotc{width:16px; height:16px; border-radius:50%; border:1.5px solid var(--saddle-tan); flex-shrink:0;}
.opt.correct .dotc{background:var(--forest-mid); border-color:var(--forest-mid);}
.opt.wrong .dotc{background:var(--chestnut); border-color:var(--chestnut);}

let S = structuredClone(DEFAULT_STATE);

async function loadState(){

  }catch(e){ /* keine gespeicherten Daten vorhanden */ }
}
async function saveState(){
  try{ localStorage.setItem('stallbuch-state', JSON.stringify(S)); }catch(e){ console.error('Speichern fehlgeschlagen', e); }

/* ============================= RENDER HELPERS ============================= */
function screenEl(){ return document.getElementById('screen'); }
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function initials(name){ if(!name) return '?'; return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function avatarHTML(photo, name, size){
  if(photo) return `<img class="avatar" src="${photo}" style="width:${size}px;height:${size}px;">`;
  return `<div class="avatar" style="width:${size}px;height:${size}px;">${esc(initials(name))}</div>`;
}
function weekTrainingCounts(){
  const now = new Date(); const day = (now.getDay()+6)%7; // Mo=0
  const monday = new Date(now); monday.setDate(now.getDate()-day); monday.setHours(0,0,0,0);
  let pferd=0, reiter=0;
  S.trainings.forEach(t=>{ const d=new Date(t.date+'T00:00:00'); if(d>=monday){ if(t.kind==='pferd') pferd++; else reiter++; } });
  return {pferd, reiter};
}
function upcomingAppointment(){
  const today = todayISO();
  const upcoming = S.appointments.filter(a=>a.date>=today).sort((a,b)=>a.date.localeCompare(b.date));
  return upcoming[0]||null;
}
function daysUntil(iso){
  const diff = Math.round((new Date(iso+'T00:00:00') - new Date(todayISO()+'T00:00:00'))/86400000);
  if(diff<=0) return 'heute';
  if(diff===1) return 'morgen';
  return `in ${diff} Tagen`;
}
function monthCostTotal(){
  const ym = todayISO().slice(0,7);
  return S.costs.filter(c=>c.date.slice(0,7)===ym).reduce((s,c)=>s+Number(c.amount||0),0);
}

/* ============================= MODAL SYSTEM ============================= */
const Modal = {};
Modal.close = function(){ document.getElementById('modal-root').innerHTML=''; };
Modal.form = function(title, fields, onSubmit, submitLabel){
  const root = document.getElementById('modal-root');
  const fieldsHTML = fields.map(f=>{
    if(f.type==='select'){
      return `<div class="field"><label>${f.label}</label><select id="mf-${f.id}">
        ${f.options.map(o=>`<option value="${esc(o.value)}" ${f.value===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}
      </select></div>`;
    }
    return `<div class="field"><label>${f.label}</label><input id="mf-${f.id}" type="${f.type||'text'}" value="${esc(f.value||'')}" placeholder="${esc(f.placeholder||'')}"></div>`;
  }).join('');
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) Modal.close()">
      <div class="modal-sheet">
        <div class="modal-title">${title}</div>
        ${fieldsHTML}
        <div class="modal-actions">
          <button class="btn btn-ghost" style="flex:1;" onclick="Modal.close()">Abbrechen</button>
          <button class="btn btn-primary" style="flex:2;" id="mf-submit">${submitLabel||'Speichern'}</button>
        </div>
      </div>
    </div>`;
  document.getElementById('mf-submit').onclick = function(){
    const values = {};
    fields.forEach(f=>{ values[f.id] = document.getElementById('mf-'+f.id).value.trim(); });
    onSubmit(values);
  };
};
Modal.confirm = function(text, onYes){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) Modal.close()">
      <div class="modal-sheet">
        <div class="modal-title">Bist du sicher?</div>
        <p style="font-size:13px; color:var(--ink-soft); line-height:1.5;">${esc(text)}</p>
        <div class="modal-actions">
          <button class="btn btn-ghost" style="flex:1;" onclick="Modal.close()">Abbrechen</button>
          <button class="btn btn-primary" style="flex:1;" id="mc-yes">Ja, entfernen</button>
        </div>
      </div>
    </div>`;
  document.getElementById('mc-yes').onclick = function(){ Modal.close(); onYes(); };
};
Modal.toast = function(msg){
  const root = document.getElementById('modal-root');
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  root.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 2200);
};

};

Screens.arenaClick = function(ev){
  const rect = ev.currentTarget.getBoundingClientRect();
  const x = ((ev.clientX-rect.left)/rect.width*100).toFixed(1);
  const y = ((ev.clientY-rect.top)/rect.height*100).toFixed(1);
  Nav.arenaCounter++;
  let label = Nav.arenaCounter;
  if(Nav.arenaMode==='Dressur'){ const letters=['A','K','V','E','S','H','C','M','R','B','F','P']; label = letters[(Nav.arenaCounter-1)%letters.length]; }
  Nav.arenaObstacles.push({x,y,label});
  Screens.mountArena();
};

/* ---- CARE / CALENDAR ---- */
Screens.care = function(){
  const now = Nav.calMonth || new Date();
  Nav.calMonth = now;
  const year = now.getFullYear(), month = now.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay()+6)%7; // Mo=0
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const prevDays = new Date(year, month, 0).getDate();
  const cells = [];
  for(let i=startOffset;i>0;i--) cells.push({d:prevDays-i+1, muted:true});
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has = S.appointments.some(a=>a.date===iso);
    cells.push({d, iso, has, today: iso===todayISO()});
  }
  while(cells.length%7!==0) cells.push({d:cells.length, muted:true});
  const monthName = now.toLocaleDateString('de-DE',{month:'long', year:'numeric'});
  const dayCells = cells.map(c=>`<div class="cal-day ${c.muted?'muted':''} ${c.today?'today':''}">${c.d}${c.has?'<div class="mark"></div>':''}</div>`).join('');

  const upcoming = S.appointments.filter(a=>a.date>=todayISO()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,6);
  const apptRows = upcoming.map(a=>`
    <div class="termin-row">
      <div class="termin-date"><div class="dd2">${a.date.slice(8,10)}</div><div class="mm">${new Date(a.date+'T00:00:00').toLocaleDateString('de-DE',{month:'short'})}</div></div>
      <div class="termin-info"><div class="tn">${esc(a.title)} · ${esc(horseName(a.horseId))}</div><div class="tr">${esc(a.notes||'')}</div></div>
      <div class="hist-del" onclick="App.deleteAppointment('${a.id}')">✕</div>
    </div>`).join('') || `<div class="empty-hint">Keine anstehenden Termine.</div>`;

  const feedRows = S.horses.map(h=>`
    <div class="termin-row">
      <div class="termin-date"><div class="dd2">🌾</div></div>
      <div class="termin-info">
        <div class="tn">${esc(h.name)}</div>
        <textarea style="width:100%; border:none; background:none; font-size:11.5px; color:var(--ink-soft); resize:none;" rows="2"
          placeholder="Fütterungsplan / Besonderheiten..." onchange="App.saveFeeding('${h.id}', this.value)">${esc(S.feeding[h.id]||'')}</textarea>
      </div>
    </div>`).join('') || `<div class="empty-hint">Noch kein Pferd angelegt.</div>`;

  screenEl().innerHTML = `
    <div class="back-row"><div class="back-btn" onclick="Nav.go('home')">‹</div><div class="page-title">Versorgung</div></div>
    <div class="cal-card">
      <div class="cal-head"><div class="cm">${monthName}</div>
        <div class="cal-nav"><div onclick="Screens.calShift(-1)">‹</div><div onclick="Screens.calShift(1)">›</div></div></div>
      <div class="cal-weekdays"><div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div></div>
      <div class="cal-days">${dayCells}</div>
      <button class="add-termin" onclick="Screens.newAppointment()">+ Termin eintragen</button>
    </div>
    <div class="section-label">Anstehende Termine</div>
    ${apptRows}
    <div class="section-label">Fütterungsplan</div>
    ${feedRows}
  `;
};

Screens.newAppointment = function(){
  if(!S.horses.length){ Modal.toast('Bitte zuerst ein Pferd anlegen (Homescreen → "+").'); return; }
  const horseOptions = S.horses.map(h=>({value:h.id, label:h.name}));
  Modal.form('Termin eintragen', [
    {id:'title', label:'Was steht an?', placeholder:'z. B. Hufschmied, Tierarzt'},
    {id:'date', label:'Datum', type:'date', value:todayISO()},
    {id:'horseId', label:'Für welches Pferd?', type:'select', options:horseOptions, value:S.horses[0].id},
    {id:'notes', label:'Notiz (optional)', placeholder:''},

    S.appointments.push({id:uid(), title:v.title, date:v.date, horseId:v.horseId, notes:v.notes});

/* ---- QUIZ ---- */
function buildQuizSet(){
  const pool = KNOWLEDGE_QUESTIONS.slice();
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const chosen = pool.slice(0,3);
  const total = monthCostTotal();
  const options = [Math.round(total*0.4), Math.round(total), Math.round(total*1.7)].map(v=>Math.max(v,5));
  chosen.push({q:'Wie viel hat dich dein Hobby diesen Monat bisher gekostet?',
    opts:options.map(o=>`ca. ${o} €`), correct:1, cat:'kosten', dynamic:true});
  const wk = weekTrainingCounts();
  const trainOpts = [Math.max(wk.pferd+wk.reiter-2,0), wk.pferd+wk.reiter, wk.pferd+wk.reiter+2];
  chosen.push({q:'Wie oft hast du diese Woche schon trainiert (Pferd + Reiter zusammen)?',
    opts:trainOpts.map(o=>`${o}× diese Woche`), correct:1, cat:'training', dynamic:true});
  return chosen.slice(0,5);
}
Screens.quiz = function(){
  const doneToday = S.quiz.lastDoneDate === todayISO();
  if(doneToday && !Nav.quizForceReview){
    return Screens.quizSummary();
  }
  if(!Nav.quizSet){ Nav.quizSet = buildQuizSet(); Nav.quizIndex=0; Nav.quizAnswers=[]; }
  Screens.renderQuizQuestion();
};
Screens.renderQuizQuestion = function(){
  const idx = Nav.quizIndex; const q = Nav.quizSet[idx];
  const dots = Nav.quizSet.map((_,i)=>`<div class="qp-dot ${i<idx?'done':''}"></div>`).join('');
  const answered = Nav.quizAnswers[idx];
  const opts = q.opts.map((o,i)=>{
    let cls='opt';
    if(answered!==undefined){ if(i===q.correct) cls+=' correct'; else if(i===answered) cls+=' wrong'; }
    return `<div class="${cls}" onclick="Screens.answerQuiz(${i})"><div class="dotc"></div> ${o}</div>`;
  }).join('');
  screenEl().innerHTML = `
    <div class="back-row"><div class="back-btn" onclick="Nav.go('home')">‹</div><div class="page-title">Tages-Quiz</div></div>
    <div class="quiz-hero">
      <div class="day">Frage ${idx+1} von ${Nav.quizSet.length}</div>
      <div class="qtitle">${idx===0?('Los geht\'s, '+esc(S.profile.name||'Reiter')+'!'):'Weiter so!'}</div>
      <div class="quiz-progress-row">${dots}</div>
    </div>
    <div class="qcard">
      <div class="qn">${q.cat}</div>
      <div class="qtext">${q.q}</div>
      ${opts}
    </div>
    ${answered!==undefined ? `<button class="btn btn-primary btn-block" onclick="Screens.nextQuiz()">${idx<Nav.quizSet.length-1?'Nächste Frage':'Auswertung'}</button>` : ''}
  `;
};
Screens.answerQuiz = function(i){
  if(Nav.quizAnswers[Nav.quizIndex]!==undefined) return;
  Nav.quizAnswers[Nav.quizIndex] = i;
  const q = Nav.quizSet[Nav.quizIndex];
  if(i===q.correct){
    S.quiz.points += 10;
    S.quiz.correctByCat[q.cat] = (S.quiz.correctByCat[q.cat]||0)+1;
  }
  Screens.renderQuizQuestion();
};
Screens.nextQuiz = function(){
  if(Nav.quizIndex < Nav.quizSet.length-1){ Nav.quizIndex++; Screens.renderQuizQuestion(); }
  else{
    S.quiz.lastDoneDate = todayISO();
    checkBadges();
    saveState();
    Nav.quizForceReview=false;
    Nav.quizSet=null;
    Screens.home(); // Nudge verschwindet
    Nav.go('quiz');
  }
};
function checkBadges(){
  const thresholds = [{cat:'fuetterung', at:3, id:'fuetterung', label:'Fütterungs-Profi', icon:'🥕'},
    {cat:'kosten', at:3, id:'kosten', label:'Kosten-Checker', icon:'💶'},
    {cat:'training', at:5, id:'training', label:'Trainingswissen-Profi', icon:'🏆'}];
  thresholds.forEach(t=>{
    if((S.quiz.correctByCat[t.cat]||0) >= t.at && !S.quiz.badges.includes(t.id)) S.quiz.badges.push(t.id);
  });
}
Screens.quizSummary = function(){
  const level = Math.max(1, Math.floor(S.quiz.points/50)+1);
  const pct = S.quiz.points%50/50*100;
  const badgeDefs = {fuetterung:{icon:'🥕',label:'Fütterungs-Profi'}, kosten:{icon:'💶',label:'Kosten-Checker'}, training:{icon:'🏆',label:'Trainingswissen-Profi'}};
  const badges = S.quiz.badges.map(b=>`<div class="badge-pill"><div class="bi">${badgeDefs[b].icon}</div><div class="bt">${badgeDefs[b].label}</div></div>`).join('')
    || `<div class="empty-hint">Noch keine Auszeichnungen – beantworte weiter fleißig!</div>`;
  screenEl().innerHTML = `
    <div class="back-row"><div class="back-btn" onclick="Nav.go('home')">‹</div><div class="page-title">Tages-Quiz</div></div>
    <div class="quiz-hero"><div class="day">Heute erledigt ✓</div><div class="qtitle">Bis morgen, ${esc(S.profile.name||'Reiter')}!</div>
      <div class="quiz-progress-row">${dotsFilled(5)}</div></div>
    <div class="qlevel-card"><div><div class="ql-t">Reitwissen</div><div class="ql-v">Level ${level}</div></div><div class="ql-n">${Math.round(pct)}%</div></div>
    <div class="section-label">Deine Auszeichnungen</div>
    <div class="badges-row">${badges}</div>
    <button class="btn btn-ghost btn-block" style="margin-top:18px;" onclick="Screens.replayQuiz()">Fragen nochmal ansehen</button>
  `;
};
function dotsFilled(n){ let h=''; for(let i=0;i<n;i++) h+='<div class="qp-dot done"></div>'; return h; }
Screens.replayQuiz = function(){ Nav.quizForceReview=true; if(!Nav.quizSet) Nav.quizSet=buildQuizSet(); Nav.quizIndex=0; Screens.renderQuizQuestion(); };

Onb.finish = function(){
  S.onboarded = true; saveState();
  document.getElementById('onboarding').classList.add('hidden');
  Nav.go('home');
};

/* ============================= INIT ============================= */
(async function init(){
  await loadState();
  if(!S.onboarded){ Onb.render(); }
  else{ Nav.go('home'); }
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.log('Service Worker nicht registriert:', e));
  });
}
</script>
</body>
</html>
