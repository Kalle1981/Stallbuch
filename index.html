<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Stallbuch</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#26332A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stallbuch">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-parchment:#F6F1E4; --forest-deep:#26332A; --forest-mid:#3F5240; --saddle-tan:#C79A6B;
  --chestnut:#A85C3B; --gold-ribbon:#C9A227; --ink:#21281F; --ink-soft:#5B6255;
  --cream-card:#FFFCF5; --line:#E3D9C3;
  --font-display:'Fraunces',serif; --font-body:'Manrope',sans-serif; --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility;}
body{background:var(--bg-parchment); font-family:var(--font-body); color:var(--ink);
  display:flex; flex-direction:column; align-items:center; min-height:100vh; min-height:100dvh;}
button{font-family:var(--font-body); cursor:pointer;}
input,textarea,select{font-family:var(--font-body);}
.phone{width:100%; max-width:100%; height:100vh; height:100dvh; background:var(--bg-parchment);
  overflow:hidden; position:relative; display:flex; flex-direction:column;}
#screen{flex:1; overflow-y:auto; padding:calc(20px + env(safe-area-inset-top)) 18px calc(92px + env(safe-area-inset-bottom));
  scroll-behavior:smooth; -webkit-overflow-scrolling:touch;}
.hidden{display:none !important;}

/* ---- tap feedback ---- */
button, .fn-card, .tab, .tag, .workout-card, .horse-chip, .plan-chip, .check-item-top, .contact-row,
.termin-row, .suggest-item, .opt, .avatar-wrap, .who, .quiz-nudge, .reminder-banner, .add-chip,
.add-contact, .add-termin, .wd-row, .badge-pill, .cost-row{
  transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
}
button:active, .fn-card:active, .tag:active, .workout-card:active, .horse-chip:active,
.plan-chip:active, .quiz-nudge:active, .add-chip:active, .suggest-item:active{
  transform:scale(.97); opacity:.9;
}

/* ---- shared ---- */
.back-row{display:flex; align-items:center; gap:10px; margin-bottom:16px;}
.back-btn{width:32px; height:32px; border-radius:50%; background:var(--cream-card); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:16px; color:var(--forest-deep); box-shadow:0 1px 3px rgba(38,51,42,.06);}
.page-title{font-family:var(--font-display); font-size:21px; font-weight:600; color:var(--forest-deep);}
.section-label{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-soft); margin:0 0 10px 2px;}
.card{background:var(--cream-card); border:1px solid var(--line); border-radius:16px; padding:14px; box-shadow:0 1px 3px rgba(38,51,42,.06);}
.btn{border:none; border-radius:12px; padding:11px 16px; font-weight:700; font-size:13px;}
.btn-primary{background:var(--forest-deep); color:#F6F1E4; box-shadow:0 3px 8px rgba(38,51,42,.28);}
.btn-gold{background:var(--gold-ribbon); color:#26332A; box-shadow:0 3px 8px rgba(201,162,39,.35);}
.btn-ghost{background:var(--cream-card); border:1px solid var(--line); color:var(--forest-deep); box-shadow:0 1px 3px rgba(38,51,42,.06);}
.btn-block{width:100%;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:11px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; text-transform:uppercase; letter-spacing:.05em;}
.field input,.field textarea,.field select{width:100%; border:1.5px solid var(--line); border-radius:10px; padding:9px 11px;
  font-size:13px; background:#fff; color:var(--ink);}
.field textarea{resize:vertical; min-height:56px;}
.round-photo{width:76px; height:76px; border-radius:50%; object-fit:cover; background:var(--saddle-tan);
  display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--font-display); font-size:24px; flex-shrink:0;}
.photo-pick{position:relative; display:inline-block;}
.photo-pick input{position:absolute; inset:0; opacity:0; cursor:pointer;}
.photo-edit-badge{position:absolute; bottom:-2px; right:-2px; width:24px; height:24px; border-radius:50%;
  background:var(--forest-deep); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; border:2px solid var(--bg-parchment);}
.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.tag{font-size:11px; font-weight:700; padding:6px 11px; border-radius:16px; border:1px solid var(--line);
  color:var(--ink-soft); background:var(--cream-card); box-shadow:0 1px 3px rgba(38,51,42,.06);}
.tag.on{background:var(--saddle-tan); color:#fff; border-color:var(--saddle-tan);}
.empty-hint{font-size:12px; color:var(--ink-soft); text-align:center; padding:18px 10px;}

/* ---- home ---- */
.home-header{display:flex; align-items:flex-start; gap:14px; margin-bottom:16px;}
.avatar-wrap{position:relative; flex-shrink:0; cursor:pointer;}
.avatar{width:60px; height:60px; border-radius:50%; border:3px solid var(--cream-card); object-fit:cover;
  box-shadow:0 3px 10px rgba(0,0,0,.18); background:var(--saddle-tan); display:flex; align-items:center;
  justify-content:center; color:#fff; font-family:var(--font-display); font-size:20px;}
.who{flex:1; padding-top:4px; cursor:pointer;}
.who .name{font-family:var(--font-display); font-weight:600; font-size:18px; color:var(--forest-deep); line-height:1.1;}
.who .sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.quiz-nudge{display:flex; align-items:center; gap:12px; background:var(--gold-ribbon); border-radius:16px;
  padding:12px 14px; margin-bottom:18px; cursor:pointer;}
.quiz-nudge .qn-ic{font-size:20px;}
.quiz-nudge .qn-text{flex:1;}
.quiz-nudge .qn-text b{display:block; font-size:13px; color:#26332A;}
.quiz-nudge .qn-text span{font-size:11px; color:#3f3111;}
.horses-row{display:flex; gap:12px; margin:0 0 18px; overflow-x:auto; padding-bottom:2px;}
.horse-chip{display:flex; flex-direction:column; align-items:center; gap:5px; flex-shrink:0; width:58px; cursor:pointer;}
.horse-chip .avatar{width:50px; height:50px; font-size:16px;}
.horse-chip span{font-size:10.5px; color:var(--ink-soft); font-weight:600; text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:56px;}
.add-chip{width:50px; height:50px; border-radius:50%; border:2px dashed var(--saddle-tan);
  display:flex; align-items:center; justify-content:center; color:var(--saddle-tan); font-size:20px; cursor:pointer; background:none;}

.badge-shelf{display:flex; gap:10px; overflow-x:auto; padding:2px 2px 8px; margin-bottom:2px;}
.badge-item{display:flex; flex-direction:column; align-items:center; width:42px; flex-shrink:0;}
.badge-medal-outer{position:relative; width:34px; height:44px;}
.badge-medal{position:absolute; top:0; left:0; width:34px; height:34px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #E7C458, var(--gold-ribbon)); border:1.5px solid var(--forest-deep);
  display:flex; align-items:center; justify-content:center; font-size:14px; box-shadow:0 2px 5px rgba(38,51,42,.3); z-index:2;}
.badge-medal.locked{background:#D9D3C0; border-color:#B7AF97; box-shadow:none; font-size:11px; opacity:.85;}
.badge-tail{position:absolute; top:26px; width:8px; height:17px; background:var(--chestnut);
  clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%); z-index:1;}
.badge-tail-l{left:6px; transform:rotate(-10deg);}
.badge-tail-r{right:6px; transform:rotate(10deg);}
.badge-tail.locked{background:#B7AF97;}
.badge-label{font-size:7.5px; font-weight:700; color:var(--forest-deep); text-align:center; line-height:1.2; margin-top:1px;}
.badge-label.locked{color:var(--ink-soft); opacity:.75;}

.train-week-card{background:var(--cream-card); border:1px solid var(--line); border-radius:18px; padding:15px 16px; margin-bottom:16px; box-shadow:0 1px 3px rgba(38,51,42,.06);}
.tw-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;}
.tw-title{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); font-weight:700;}
.tw-count{font-family:var(--font-mono); font-size:17px; color:var(--forest-deep); font-weight:700;}
.tw-row{display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
.tw-label{font-size:12.5px; font-weight:700; color:var(--forest-deep); width:64px; flex-shrink:0; display:flex; align-items:center; gap:5px;}
.tw-dots{display:flex; gap:5px;}
.tw-dot{width:16px; height:16px; border-radius:50%; border:1.5px solid var(--line); background:#fff;}
.tw-dot.on{background:var(--forest-mid); border-color:var(--forest-mid);}
.tw-row.warn .tw-dot.on{background:var(--chestnut); border-color:var(--chestnut);}
.tw-goal{width:100%; font-size:9.5px; color:var(--chestnut); font-weight:700; margin-left:74px;}
.tw-nudge{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);}
.tw-nudge b{display:block; font-size:12px; color:var(--forest-deep); margin-bottom:3px;}
.tw-nudge span{font-size:11px; color:var(--ink-soft); line-height:1.45;}
.reminder-banner{display:flex; gap:10px; align-items:flex-start; background:#FBE9DA; border:1px solid #EFCDA8;
  border-radius:16px; padding:12px 14px; margin-bottom:16px; cursor:pointer;}
.reminder-banner .dot{width:8px; height:8px; border-radius:50%; background:var(--chestnut); margin-top:5px; flex-shrink:0;}
.reminder-banner b{display:block; font-size:13px; color:var(--forest-deep);}
.reminder-banner span{font-size:12px; color:var(--ink-soft);}
.backup-banner{display:flex; align-items:center; gap:11px; background:var(--forest-deep); color:#F6F1E4;
  border-radius:16px; padding:12px 14px; margin-bottom:16px; box-shadow:0 4px 12px rgba(38,51,42,.22);}
.backup-banner .bb-ic{font-size:20px; flex-shrink:0;}
.backup-banner .bb-text{flex:1;}
.backup-banner .bb-text b{display:block; font-size:13px;}
.backup-banner .bb-text span{font-size:11px; opacity:.8;}
.backup-banner .bb-arrow{font-size:20px; opacity:.7;}
.fn-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:16px;}
.fn-card{background:var(--cream-card); border:1px solid var(--line); border-radius:18px; padding:16px 14px;
  display:flex; flex-direction:column; gap:22px; min-height:92px; border:1px solid var(--line); box-shadow:0 1px 3px rgba(38,51,42,.06);}
.fn-card .ic{font-size:22px;}
.fn-card .tt{font-weight:700; font-size:13.5px; color:var(--forest-deep);}
.fn-card .dd{font-size:11px; color:var(--ink-soft); margin-top:2px;}
.fn-card.wide{grid-column:1/-1; flex-direction:row; align-items:center; gap:14px; min-height:auto;}
.home-footer{display:flex; justify-content:center; align-items:center; gap:7px; margin-top:4px; font-size:10.5px;
  color:var(--ink-soft); text-decoration:underline; text-underline-offset:2px;}
.home-footer span{cursor:pointer;}
.home-footer .fs-dot{text-decoration:none;}

.sponsor-banner{position:relative; display:flex; align-items:center; gap:11px; background:var(--cream-card);
  border:1px solid var(--line); border-radius:14px; padding:10px 12px; margin-bottom:12px; opacity:.92;}
.sponsor-tag{position:absolute; top:-7px; left:10px; background:var(--bg-parchment); border:1px solid var(--line);
  border-radius:6px; padding:1px 6px; font-size:8.5px; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em;}
.sp-logo{font-size:20px; flex-shrink:0;}
.sp-text{display:flex; flex-direction:column; min-width:0;}
.sp-text b{font-size:11.5px; color:var(--forest-deep); font-weight:700;}
.sp-text span{font-size:10px; color:var(--ink-soft); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* ---- tabs ---- */
.tab-row{display:flex; gap:7px; margin-bottom:18px; flex-wrap:wrap;}
.tab{font-size:11.5px; font-weight:700; padding:7px 12px; border-radius:20px; border:1px solid var(--line);
  color:var(--ink-soft); background:var(--cream-card); box-shadow:0 1px 3px rgba(38,51,42,.06);}
.tab.on{background:var(--forest-deep); color:#F6F1E4; border-color:var(--forest-deep);}

/* ---- exercises ---- */
.plan-scroll{display:flex; gap:10px; overflow-x:auto; margin-bottom:18px; padding-bottom:2px;}
.plan-chip{flex-shrink:0; min-width:118px; background:var(--cream-card); border:1.5px solid var(--line);
  border-radius:14px; padding:12px 14px; box-shadow:0 1px 3px rgba(38,51,42,.06);}
.plan-chip.on{border-color:var(--gold-ribbon); background:#FBF4DE;}
.plan-chip .pc-t{font-weight:700; font-size:12.5px; color:var(--forest-deep);}
.plan-chip .pc-d{font-size:10.5px; color:var(--ink-soft); margin-top:3px;}
.exercise-card{background:var(--cream-card); border:1px solid var(--line); border-radius:18px; overflow:hidden; margin-bottom:14px; box-shadow:0 1px 3px rgba(38,51,42,.06);}
.ex-img{height:110px; background:linear-gradient(135deg,#DCC9A3,#B98E5F); display:flex; align-items:center; justify-content:center; font-size:32px;}
.ex-body{padding:13px 15px 15px;}
.ex-title{font-weight:700; font-size:14px; color:var(--forest-deep); display:flex; justify-content:space-between; align-items:center;}
.ex-meta{font-family:var(--font-mono); font-size:10.5px; color:var(--chestnut);}
.ex-tag-mini{display:inline-block; font-family:var(--font-mono); font-size:9.5px; color:var(--forest-deep);
  background:#EAF0E7; padding:2px 7px; border-radius:6px; margin-top:6px;}
.ex-why{margin-top:8px; background:#F0ECDD; border-left:3px solid var(--saddle-tan); border-radius:6px;
  padding:8px 10px; font-size:11.5px; color:var(--ink-soft); line-height:1.45;}
.ex-why b{color:var(--forest-deep);}
.log-btn{margin-top:10px; width:100%; background:var(--forest-deep); color:#F6F1E4; border:none; border-radius:9px; padding:8px; font-size:11.5px; font-weight:700;}

.suggest-item{display:flex; align-items:center; gap:11px; background:var(--cream-card); border:1px solid var(--line);
  border-radius:12px; padding:11px 12px; margin-bottom:8px; cursor:pointer; box-shadow:0 1px 3px rgba(38,51,42,.06);}
.suggest-item.on{border-color:var(--forest-mid); background:#EAF0E7;}
.sug-check{width:18px; height:18px; border-radius:6px; border:1.5px solid var(--saddle-tan); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:11px; color:#fff;}
.suggest-item.on .sug-check{background:var(--forest-mid); border-color:var(--forest-mid);}
.sug-info .st{font-weight:700; font-size:12.5px; color:var(--forest-deep);}
.sug-info .sd{font-size:10.5px; color:var(--ink-soft);}
.plan-preview{background:var(--forest-deep); color:#F6F1E4; border-radius:16px; padding:14px 16px; margin-top:16px; box-shadow:0 4px 12px rgba(38,51,42,.22);}
.plan-preview .pp-title{font-family:var(--font-display); font-size:14px; font-weight:600; margin-bottom:6px;}
.plan-preview .pp-list{font-size:11.5px; opacity:.85; line-height:1.5; margin-bottom:10px;}

/* ---- rider workouts ---- */
.workout-card{display:flex; align-items:center; gap:14px; background:var(--cream-card); border:1px solid var(--line);
  border-radius:16px; padding:14px 16px; margin-bottom:12px; box-shadow:0 1px 3px rgba(38,51,42,.06);}
.wc-icon{font-size:26px; flex-shrink:0;}
.wc-body{flex:1;}
.wc-title{font-weight:700; font-size:14px; color:var(--forest-deep);}
.wc-desc{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
.wc-arrow{font-size:20px; color:var(--saddle-tan);}
.workout-hero{background:var(--forest-deep); color:#F6F1E4; border-radius:18px; padding:20px; text-align:center; margin-bottom:18px; box-shadow:0 4px 12px rgba(38,51,42,.22);}
.wh-icon{font-size:36px; margin-bottom:6px;}
.wh-desc{font-size:12.5px; opacity:.85;}
.wd-row{display:flex; align-items:center; gap:12px; background:var(--cream-card); border:1px solid var(--line);
  border-radius:12px; padding:10px 12px; margin-bottom:7px; box-shadow:0 1px 3px rgba(38,51,42,.06);}
.wd-num{width:22px; height:22px; border-radius:50%; background:var(--saddle-tan); color:#fff; font-size:11px; font-weight:700;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.wd-ic{font-size:18px;}
.wd-info{flex:1;}
.wd-t{font-weight:700; font-size:12.5px; color:var(--forest-deep);}
.wd-m{font-size:10.5px; color:var(--ink-soft);}
.workout-player{background:var(--cream-card); border:1px solid var(--line); border-radius:20px; padding:26px 20px; text-align:center; margin-bottom:18px; box-shadow:0 1px 3px rgba(38,51,42,.06);}
.wp-count{font-family:var(--font-mono); font-size:10.5px; color:var(--chestnut); text-transform:uppercase; letter-spacing:.08em; margin-bottom:10px;}
.wp-icon{font-size:52px; margin-bottom:10px;}
.wp-title{font-family:var(--font-display); font-size:20px; font-weight:600; color:var(--forest-deep); margin-bottom:6px;}
.wp-target{font-family:var(--font-mono); font-size:16px; color:var(--forest-mid); font-weight:600; margin-bottom:14px;}
.wp-why{background:#F0ECDD; border-left:3px solid var(--saddle-tan); border-radius:6px; padding:9px 11px; font-size:11.5px;
  color:var(--ink-soft); line-height:1.45; text-align:left;}
.wp-why b{color:var(--forest-deep);}
.workout-done{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding-top:60px;}
.wdone-icon{font-size:56px; margin-bottom:14px;}
.wdone-title{font-family:var(--font-display); font-size:24px; font-weight:600; color:var(--forest-deep); margin-bottom:8px;}
.wdone-sub{font-size:13px; color:var(--ink-soft); max-width:260px;}

/* ---- arena ---- */
.arena-card{background:var(--forest-deep); border-radius:18px; padding:16px; color:#F6F1E4; margin-bottom:16px; box-shadow:0 4px 12px rgba(38,51,42,.22);}
.arena-card .tt{font-family:var(--font-display); font-size:15px; font-weight:600; margin-bottom:10px;}
.arena-grid{background:#3B4A3B; border-radius:10px; height:190px; position:relative; cursor:crosshair;
  background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 25px),
  repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, transparent 1px 25px); margin-bottom:10px; overflow:hidden;}
.obstacle{position:absolute; width:28px; height:16px; background:var(--gold-ribbon); border-radius:3px;
  box-shadow:0 2px 4px rgba(0,0,0,.3); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:9px; color:#26332A; font-weight:700; transform:translate(-50%,-50%);}
.arena-actions{display:flex; gap:8px;}
.mini-btn{flex:1; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); color:#F6F1E4;
  border-radius:10px; padding:9px; font-size:11px; font-weight:700; text-align:center; border:none;}
.mini-btn.gold{background:var(--gold-ribbon); color:#26332A;}
.arena-hint{font-size:10.5px; opacity:.7; margin-bottom:10px;}

/* ---- history ---- */
.hist-row{display:flex; align-items:center; gap:12px; background:var(--cream-card); border:1px solid var(--line);
  border-radius:14px; padding:11px 12px; margin-bottom:8px; box-shadow:0 1px 3px rgba(38,51,42,.06);}
.hist-ic{width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
.hist-ic.rider{background:#F3E6D6; color:var(--chestnut);}
.hist-ic.horse{background:#EAF0E7; color:var(--forest-mid);}
.hist-info{flex:1;}
.hist-info .ht{font-weight:700; font-size:12.5px; color:var(--forest-deep);}
.hist-info .hd{font-size:10.5px; color:var(--ink-soft);}
.hist-del{font-size:14px; color:var(--ink-soft); flex-shrink:0;}

/* ---- calendar ---- */
.cal-card{background:var(--cream-card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:18px; box-shadow:0 1px 3px rgba(38,51,42,.06);}
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.cal-head .cm{font-family:var(--font-display); font-size:15px; font-weight:600; color:var(--forest-deep);}
.cal-nav{display:flex; gap:6px;}

/* ============================= RENDER HELPERS ============================= */
function screenEl(){ return document.getElementById('screen'); }
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function initials(name){ if(!name) return '?'; return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function avatarHTML(photo, name, size){
  if(photo) return `<img class="avatar" src="${photo}" style="width:${size}px;height:${size}px;">`;
  return `<div class="avatar" style="width:${size}px;height:${size}px;">${esc(initials(name))}</div>`;
}
function weekTrainingCounts(){
  const now = new Date(); const day = (now.getDay()+6)%7; // Mo=0
  const monday = new Date(now); monday.setDate(now.getDate()-day); monday.setHours(0,0,0,0);
  let pferd=0, reiter=0;
  S.trainings.forEach(t=>{ const d=new Date(t.date+'T00:00:00'); if(d>=monday){ if(t.kind==='pferd') pferd++; else reiter++; } });
  return {pferd, reiter};
}
function upcomingAppointment(){
  const today = todayISO();
  const upcoming = S.appointments.filter(a=>a.date>=today).sort((a,b)=>a.date.localeCompare(b.date));
  return upcoming[0]||null;
}
function daysUntil(iso){
  const diff = Math.round((new Date(iso+'T00:00:00') - new Date(todayISO()+'T00:00:00'))/86400000);
  if(diff<=0) return 'heute';
  if(diff===1) return 'morgen';
  return `in ${diff} Tagen`;
}
function needsBackupReminder(){
  if(!S.lastBackupDate) return true;
  const diff = Math.round((new Date(todayISO()+'T00:00:00') - new Date(S.lastBackupDate+'T00:00:00'))/86400000);
  return diff >= 30;
}
function monthCostTotal(){
  const ym = todayISO().slice(0,7);
  return S.costs.filter(c=>c.date.slice(0,7)===ym).reduce((s,c)=>s+Number(c.amount||0),0);
}

/* ============================= MODAL SYSTEM ============================= */
const Modal = {};
Modal.close = function(){ document.getElementById('modal-root').innerHTML=''; };
Modal.form = function(title, fields, onSubmit, submitLabel){
  const root = document.getElementById('modal-root');
  const fieldsHTML = fields.map(f=>{
    if(f.type==='select'){
      return `<div class="field"><label>${f.label}</label><select id="mf-${f.id}">
        ${f.options.map(o=>`<option value="${esc(o.value)}" ${f.value===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}
      </select></div>`;
    }
    return `<div class="field"><label>${f.label}</label><input id="mf-${f.id}" type="${f.type||'text'}" value="${esc(f.value||'')}" placeholder="${esc(f.placeholder||'')}"></div>`;
  }).join('');
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) Modal.close()">
      <div class="modal-sheet">
        <div class="modal-title">${title}</div>
        ${fieldsHTML}
        <div class="modal-actions">
          <button class="btn btn-ghost" style="flex:1;" onclick="Modal.close()">Abbrechen</button>
          <button class="btn btn-primary" style="flex:2;" id="mf-submit">${submitLabel||'Speichern'}</button>
        </div>
      </div>
    </div>`;
  document.getElementById('mf-submit').onclick = function(){
    const values = {};
    fields.forEach(f=>{ values[f.id] = document.getElementById('mf-'+f.id).value.trim(); });
    onSubmit(values);
  };
};
Modal.confirm = function(text, onYes){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) Modal.close()">
      <div class="modal-sheet">
        <div class="modal-title">Bist du sicher?</div>
        <p style="font-size:13px; color:var(--ink-soft); line-height:1.5;">${esc(text)}</p>
        <div class="modal-actions">
          <button class="btn btn-ghost" style="flex:1;" onclick="Modal.close()">Abbrechen</button>
          <button class="btn btn-primary" style="flex:1;" id="mc-yes">Ja, entfernen</button>
        </div>
      </div>
    </div>`;
  document.getElementById('mc-yes').onclick = function(){ Modal.close(); onYes(); };
};
Modal.toast = function(msg){
  const root = document.getElementById('modal-root');
  const el = document.createElement('div');
  el.className='toast'; el.textContent=msg;
  root.appendChild(el);
  setTimeout(()=>{ el.remove(); }, 2200);
};

Screens.workoutStart = function(workoutId){
  Nav.workout = {planId:workoutId, step:0, startedAt:Date.now()};
  Screens.workoutStep();
};
Screens.workoutStep = function(){
  const w = RIDER_WORKOUTS.find(x=>x.id===Nav.workout.planId);
  const step = Nav.workout.step;
  const exId = w.exercises[step];
  const ex = EXERCISE_LIBRARY[exId];
  const dots = w.exercises.map((_,i)=>`<div class="qp-dot ${i<step?'done':''}"></div>`).join('');
  screenEl().innerHTML = `
    <div class="back-row"><div class="back-btn" onclick="Screens.workoutCancel()">✕</div><div class="page-title">${w.title}</div></div>
    <div class="quiz-progress-row" style="margin-bottom:18px;">${dots}</div>
    <div class="workout-player">
      <div class="wp-count">Übung ${step+1} von ${w.exercises.length}</div>
      <div class="wp-icon">${ex.img}</div>
      <div class="wp-title">${ex.title}</div>
      <div class="wp-target" id="wp-target">${ex.target}</div>
      <div class="wp-why"><b>Warum:</b> ${ex.why}</div>
    </div>
    <button class="btn btn-primary btn-block" id="wp-next-btn" onclick="Screens.workoutNext()">
      ${step<w.exercises.length-1?'Fertig, weiter':'Letzte Übung abschließen'}
    </button>
    <button class="btn btn-ghost btn-block" style="margin-top:10px;" onclick="Screens.workoutCancel()">Abbrechen</button>
  `;
  Screens.startWorkoutTimer(ex);
};
Screens.startWorkoutTimer = function(ex){
  if(Nav.workoutTimerId){ clearInterval(Nav.workoutTimerId); Nav.workoutTimerId=null; }
  if(!ex.seconds) return;
  let remaining = ex.seconds;
  const el = document.getElementById('wp-target');
  Nav.workoutTimerId = setInterval(()=>{
    remaining--;
    if(el) el.textContent = remaining>0 ? `noch ${remaining} Sek.` : 'Fertig!';
    if(remaining<=0){ clearInterval(Nav.workoutTimerId); Nav.workoutTimerId=null; }
  }, 1000);
};
Screens.workoutNext = function(){
  if(Nav.workoutTimerId){ clearInterval(Nav.workoutTimerId); Nav.workoutTimerId=null; }
  const w = RIDER_WORKOUTS.find(x=>x.id===Nav.workout.planId);
  if(Nav.workout.step < w.exercises.length-1){
    Nav.workout.step++;
    Screens.workoutStep();
  } else {
    Screens.workoutComplete();
  }
};
Screens.workoutCancel = function(){
  if(Nav.workoutTimerId){ clearInterval(Nav.workoutTimerId); Nav.workoutTimerId=null; }
  Nav.workout = null;
  Modal.toast('Training abgebrochen – wurde nicht erfasst.');
  Nav.go('training');
};
Screens.workoutComplete = function(){
  const w = RIDER_WORKOUTS.find(x=>x.id===Nav.workout.planId);
  S.trainings.push({id:uid(), kind:'reiter', title:'Reitertraining · '+w.title, minutes:w.minutes, date:todayISO(), category:w.id});
  saveState();
  Nav.workout = null;
  screenEl().innerHTML = `
    <div class="workout-done">
      <div class="wdone-icon">🎉</div>
      <div class="wdone-title">Geschafft!</div>
      <div class="wdone-sub">${w.title} erfolgreich abgeschlossen und eingetragen.</div>

  `;
};

Screens.mountArena = function(){
  const grid = document.getElementById('arena-grid');
  if(!grid) return;
  grid.innerHTML = Nav.arenaObstacles.map(o=>`<div class="obstacle" style="top:${o.y}%; left:${o.x}%;">${o.label}</div>`).join('');
  Screens.renderSavedArenas();
};
Screens.arenaClick = function(ev){
  const rect = ev.currentTarget.getBoundingClientRect();
  const x = ((ev.clientX-rect.left)/rect.width*100).toFixed(1);
  const y = ((ev.clientY-rect.top)/rect.height*100).toFixed(1);
  Nav.arenaCounter++;
  let label = Nav.arenaCounter;
  if(Nav.arenaMode==='Dressur'){ const letters=['A','K','V','E','S','H','C','M','R','B','F','P']; label = letters[(Nav.arenaCounter-1)%letters.length]; }
  Nav.arenaObstacles.push({x,y,label});
  Screens.mountArena();
};
Screens.arenaClear = function(){ Nav.arenaObstacles=[]; Nav.arenaCounter=0; Screens.mountArena(); };
Screens.arenaAnnounce = function(){
  if(!Nav.arenaObstacles.length){ Modal.toast('Bitte zuerst Punkte auf dem Feld setzen.'); return; }
  const words = Nav.arenaMode==='Springen'
    ? Nav.arenaObstacles.map(o=>`Hindernis ${o.label}`).join(', ')
    : Nav.arenaObstacles.map(o=>o.label).join(', ');
  const text = `${Nav.arenaMode==='Springen'?'Dein Parcours':'Deine Strecke'}: ${words}. Viel Erfolg!`;
  try{
    const u = new SpeechSynthesisUtterance(text); u.lang='de-DE';
    window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  }catch(e){ Modal.toast(text); }
};
Screens.arenaSave = function(){
  if(!Nav.arenaObstacles.length){ Modal.toast('Bitte zuerst Punkte setzen.'); return; }
  S.arenas = S.arenas || [];
  S.arenas.push({id:uid(), mode:Nav.arenaMode, count:Nav.arenaObstacles.length, date:todayISO()});

/* ---- CARE / CALENDAR ---- */
Screens.care = function(){
  const now = Nav.calMonth || new Date();
  Nav.calMonth = now;
  const year = now.getFullYear(), month = now.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay()+6)%7; // Mo=0
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const prevDays = new Date(year, month, 0).getDate();
  const cells = [];
  for(let i=startOffset;i>0;i--) cells.push({d:prevDays-i+1, muted:true});
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const has = S.appointments.some(a=>a.date===iso);
    cells.push({d, iso, has, today: iso===todayISO()});
  }
  while(cells.length%7!==0) cells.push({d:cells.length, muted:true});
  const monthName = now.toLocaleDateString('de-DE',{month:'long', year:'numeric'});
  const dayCells = cells.map(c=>`<div class="cal-day ${c.muted?'muted':''} ${c.today?'today':''}">${c.d}${c.has?'<div class="mark"></div>':''}</div>`).join('');

  const upcoming = S.appointments.filter(a=>a.date>=todayISO()).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||'')).slice(0,6);
  const apptRows = upcoming.map(a=>`
    <div class="termin-row">
      <div class="termin-date"><div class="dd2">${a.date.slice(8,10)}</div><div class="mm">${new Date(a.date+'T00:00:00').toLocaleDateString('de-DE',{month:'short'})}</div></div>
      <div class="termin-info"><div class="tn">${esc(a.title)}${a.time?' · '+esc(a.time)+' Uhr':''} · ${esc(horseName(a.horseId))}</div><div class="tr">${esc(a.notes||'')}</div></div>
      <div class="hist-del" onclick="App.deleteAppointment('${a.id}')">✕</div>
    </div>`).join('') || `<div class="empty-hint">Keine anstehenden Termine.</div>`;

  const feedRows = S.horses.map(h=>`
    <div class="termin-row">
      <div class="termin-date"><div class="dd2">🌾</div></div>
      <div class="termin-info">
        <div class="tn">${esc(h.name)}</div>
        <textarea style="width:100%; border:none; background:none; font-size:11.5px; color:var(--ink-soft); resize:none;" rows="2"
          placeholder="Fütterungsplan / Besonderheiten..." onchange="App.saveFeeding('${h.id}', this.value)">${esc(S.feeding[h.id]||'')}</textarea>
      </div>
    </div>`).join('') || `<div class="empty-hint">Noch kein Pferd angelegt.</div>`;

  screenEl().innerHTML = `
    <div class="back-row"><div class="back-btn" onclick="Nav.go('home')">‹</div><div class="page-title">Terminplanung</div></div>
    <div class="cal-card">
      <div class="cal-head"><div class="cm">${monthName}</div>
        <div class="cal-nav"><div onclick="Screens.calShift(-1)">‹</div><div onclick="Screens.calShift(1)">›</div></div></div>
      <div class="cal-weekdays"><div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div></div>
      <div class="cal-days">${dayCells}</div>
      <button class="add-termin" onclick="Screens.newAppointment()">+ Termin eintragen</button>
    </div>
    <div class="section-label">Anstehende Termine</div>
    ${apptRows}
    <div class="section-label">Fütterungsplan</div>
    ${feedRows}
  `;
};
Screens.calShift = function(dir){ const m = Nav.calMonth||new Date(); Nav.calMonth = new Date(m.getFullYear(), m.getMonth()+dir, 1); Screens.care(); };
Screens.newAppointment = function(){
  if(!S.horses.length){ Modal.toast('Bitte zuerst ein Pferd anlegen (Homescreen → "+").'); return; }
  const horseOptions = S.horses.map(h=>({value:h.id, label:h.name}));
  Modal.form('Termin eintragen', [
    {id:'title', label:'Was steht an?', placeholder:'z. B. Hufschmied, Tierarzt'},
    {id:'date', label:'Datum', type:'date', value:todayISO()},
    {id:'time', label:'Uhrzeit (optional)', type:'time', value:''},
    {id:'horseId', label:'Für welches Pferd?', type:'select', options:horseOptions, value:S.horses[0].id},
    {id:'notes', label:'Notiz (optional)', placeholder:''},
  ], function(v){
    if(!v.title || !v.date){ Modal.toast('Bitte Titel und Datum angeben.'); return; }
    S.appointments.push({id:uid(), title:v.title, date:v.date, time:v.time||'', horseId:v.horseId, notes:v.notes});
    saveState(); Modal.close(); Screens.care();
  });
};

function buildQuizSet(){
  const pool = KNOWLEDGE_QUESTIONS.slice();
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const chosen = pool.slice(0,3);
  const total = monthCostTotal();
  const options = [Math.round(total*0.4), Math.round(total), Math.round(total*1.7)].map(v=>Math.max(v,5));
  chosen.push({q:'Wie viel hat dich dein Hobby diesen Monat bisher gekostet?',
    opts:options.map(o=>`ca. ${o} €`), correct:1, cat:'kosten', dynamic:true});
  const wk = weekTrainingCounts();
  const trainOpts = [Math.max(wk.pferd+wk.reiter-2,0), wk.pferd+wk.reiter, wk.pferd+wk.reiter+2];
  chosen.push({q:'Wie oft hast du diese Woche schon trainiert (Pferd + Reiter zusammen)?',
    opts:trainOpts.map(o=>`${o}× diese Woche`), correct:1, cat:'training', dynamic:true});
  return chosen.slice(0,5);
}
Screens.quiz = function(){
  const doneToday = S.quiz.lastDoneDate === todayISO();
  if(doneToday && !Nav.quizForceReview){
    return Screens.quizSummary();
  }
  if(!Nav.quizSet){ Nav.quizSet = buildQuizSet(); Nav.quizIndex=0; Nav.quizAnswers=[]; }
  Screens.renderQuizQuestion();
};
Screens.renderQuizQuestion = function(){
  const idx = Nav.quizIndex; const q = Nav.quizSet[idx];
  const dots = Nav.quizSet.map((_,i)=>`<div class="qp-dot ${i<idx?'done':''}"></div>`).join('');
  const answered = Nav.quizAnswers[idx];
  const opts = q.opts.map((o,i)=>{
    let cls='opt';
    if(answered!==undefined){ if(i===q.correct) cls+=' correct'; else if(i===answered) cls+=' wrong'; }
    return `<div class="${cls}" onclick="Screens.answerQuiz(${i})"><div class="dotc"></div> ${o}</div>`;
  }).join('');
  screenEl().innerHTML = `
    <div class="back-row"><div class="back-btn" onclick="Nav.go('home')">‹</div><div class="page-title">Tages-Quiz</div></div>
    <div class="quiz-hero">
      <div class="day">Frage ${idx+1} von ${Nav.quizSet.length}</div>
      <div class="qtitle">${idx===0?('Los geht\'s, '+esc(S.profile.name||'Reiter')+'!'):'Weiter so!'}</div>
      <div class="quiz-progress-row">${dots}</div>
    </div>
    <div class="qcard">
      <div class="qn">${q.cat}</div>
      <div class="qtext">${q.q}</div>
      ${opts}
    </div>
    ${answered!==undefined ? `<button class="btn btn-primary btn-block" onclick="Screens.nextQuiz()">${idx<Nav.quizSet.length-1?'Nächste Frage':'Auswertung'}</button>` : ''}
  `;
};
Screens.answerQuiz = function(i){
  if(Nav.quizAnswers[Nav.quizIndex]!==undefined) return;
  Nav.quizAnswers[Nav.quizIndex] = i;
  const q = Nav.quizSet[Nav.quizIndex];
  if(i===q.correct){
    S.quiz.points += 10;
    S.quiz.correctByCat[q.cat] = (S.quiz.correctByCat[q.cat]||0)+1;
  }
  Screens.renderQuizQuestion();
};
Screens.nextQuiz = function(){
  if(Nav.quizIndex < Nav.quizSet.length-1){ Nav.quizIndex++; Screens.renderQuizQuestion(); }
  else{
    S.quiz.lastDoneDate = todayISO();
    checkBadges();
    saveState();
    Nav.quizForceReview=false;
    Nav.quizSet=null;
    Screens.home(); // Nudge verschwindet
    Nav.go('quiz');
  }
};
function checkBadges(){
  Object.entries(BADGE_DEFS).forEach(([id,b])=>{
    if((S.quiz.correctByCat[b.cat]||0) >= b.at && !S.quiz.badges.includes(id)) S.quiz.badges.push(id);
  });
}
Screens.quizSummary = function(){
  const level = Math.max(1, Math.floor(S.quiz.points/50)+1);

  const badges = S.quiz.badges.map(b=>`<div class="badge-pill"><div class="bi">${BADGE_DEFS[b].icon}</div><div class="bt">${BADGE_DEFS[b].label}</div></div>`).join('')

function resizeImageFile(file, maxDim, callback){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w > h){ if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
      else{ if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
App.handleTournamentPhoto = function(ev){
  const files = Array.from(ev.target.files || []);
  if(!files.length) return;
  let remaining = files.length;
  files.forEach(file=>{

      Nav.tournamentDraft.photos.push(dataUrl);
      remaining--;
      if(remaining===0){
        Screens.renderTournamentEdit(!S.tournaments.find(x=>x.id===Nav.tournamentDraft.id));

  });
};

  t.placement = document.getElementById('tr-placement').value.trim();
  t.notes = document.getElementById('tr-notes').value.trim();
  const idx = S.tournaments.findIndex(x=>x.id===t.id);
  if(idx>=0) S.tournaments[idx] = t; else S.tournaments.push(t);
  saveState();
  Nav.tournamentDraft = null;
  Modal.toast('Turnier gespeichert!');
  Nav.go('tournaments');
};
App.deleteTournament = function(id){
  Modal.confirm('Diesen Turniereintrag wirklich löschen?', function(){
    S.tournaments = S.tournaments.filter(t=>t.id!==id);
    saveState(); Nav.tournamentDraft=null; Nav.go('tournaments');
  });
};
App.saveProfile = function(){
  S.profile.name = document.getElementById('pf-name').value.trim() || S.profile.name;
  S.profile.level = document.getElementById('pf-level').value;
  saveState(); Nav.go('home');
};
App.saveHorse = function(id, isNew){
  const name = document.getElementById('hs-name').value.trim();
  if(!name){ Modal.toast('Bitte einen Namen eingeben.'); return; }
  const data = {
    name, type:document.getElementById('hs-type').value.trim(),
    age:document.getElementById('hs-age').value.trim(),
    notes:document.getElementById('hs-notes').value.trim(),
  };
  if(isNew){
    S.horses.push({id, ...data, photo:Nav.pendingHorsePhoto||null});
    Nav.pendingHorsePhoto=null;
  } else {
    const h = S.horses.find(x=>x.id===id); Object.assign(h, data);
  }
  saveState(); Nav.go('home');
};
App.deleteHorse = function(id){
  Modal.confirm('Dieses Pferd wirklich entfernen?', function(){
    S.horses = S.horses.filter(h=>h.id!==id); saveState(); Nav.go('home');
  });
};
App.saveHorseSession = function(){
  const picker = document.getElementById('horse-picker');
  if(!picker) return;
  const horseId = picker.value;
  const sel = Nav.horseSelected[Nav.horseTab];
  const chosen = HORSE_SUGGESTIONS[Nav.horseTab].filter(s=>sel && sel.has(s.id));
  if(!chosen.length) return;
  const title = `${Nav.horseTab} · ${horseName(horseId)}`;
  S.trainings.push({id:uid(), kind:'pferd', title, minutes:chosen.length*10, date:todayISO(), category:Nav.horseTab});
  Nav.horseSelected[Nav.horseTab] = new Set();
  saveState(); Modal.toast('Trainingseinheit gespeichert!');
  Screens.renderTrainTab();
};
App.deleteTraining = function(id){ S.trainings = S.trainings.filter(t=>t.id!==id); saveState(); Screens.renderTrainTab(); };
App.deleteAppointment = function(id){ S.appointments = S.appointments.filter(a=>a.id!==id); saveState(); Screens.care(); };
App.saveFeeding = function(horseId, val){ S.feeding[horseId]=val; saveState(); };
App.addCost = function(key, label){
  const input = document.getElementById('amt-'+key);
  const dateInput = document.getElementById('date-'+key);
  const amount = parseFloat(input.value);
  if(!amount || amount<=0){ Modal.toast('Bitte einen gültigen Betrag eingeben.'); return; }
  const date = (dateInput && dateInput.value) || todayISO();
  const freq = Nav['freq_'+key] || 'monatlich';
  S.costs.push({id:uid(), key, label, amount, freq, date});
  saveState(); Screens.renderCostsTab();
};
App.deleteCost = function(id){ S.costs = S.costs.filter(c=>c.id!==id); saveState(); Screens.renderCostsTab(); };
App.deleteContact = function(id){ S.contacts = S.contacts.filter(c=>c.id!==id); saveState(); Screens.contacts(); };
App.resetAll = async function(){
  Modal.confirm('Wirklich alle App-Daten zurücksetzen? Das kann nicht rückgängig gemacht werden.', async function(){
    S = structuredClone(DEFAULT_STATE);
    await saveState();
    location.reload();
  });
};
App.exportData = function(){
  try{
    const dataStr = JSON.stringify(S, null, 2);
    const blob = new Blob([dataStr], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'stallbuch-sicherung-' + todayISO() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    S.lastBackupDate = todayISO();
    saveState();
    Modal.toast('Sicherung wird heruntergeladen …');
  }catch(e){
    Modal.toast('Sicherung konnte nicht erstellt werden.');
  }
};
App.importDataFile = function(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    let parsed;
    try{ parsed = JSON.parse(e.target.result); }
    catch(err){ Modal.toast('Diese Datei konnte nicht gelesen werden.'); return; }
    Modal.confirm('Aktuelle App-Daten durch diese Sicherung ersetzen? Nicht gesicherte aktuelle Daten gehen dabei verloren.', async function(){
      S = Object.assign(structuredClone(DEFAULT_STATE), parsed);
      await saveState();
      Modal.toast('Daten wiederhergestellt!');
      Nav.go('home');
    });
  };
  reader.readAsText(file);
  ev.target.value = '';
};

/* ============================= ONBOARDING ============================= */
const Onb = { step:0, name:'', horseName:'' };
Onb.render = function(){
  const el = document.getElementById('onboarding');
  el.classList.remove('hidden');
  document.getElementById('navbar').classList.add('hidden');
  const steps = [Onb.stepWelcome, Onb.stepName, Onb.stepHorse, Onb.stepTour, Onb.stepStorage];
  el.innerHTML = steps[Onb.step]();
};
Onb.progress = function(total){
  let h='<div class="onb-progress">';
  for(let i=0;i<total;i++) h+=`<div class="${i<=Onb.step?'on':''}"></div>`;
  return h+'</div>';
};
Onb.stepWelcome = function(){
  return `
    <div class="onb-helper">🧑‍🌾</div>
    ${Onb.progress(5)}
    <div class="onb-title">Hallo, ich bin Theo!</div>
    <div class="onb-sub">Dein Stallhelfer für die App</div>
    <div class="onb-bubble">Schön, dass du da bist! Ich zeig dir kurz, wie <b>Stallbuch</b> dir hilft, Training,
      Terminplanung und Kosten rund um deinen Pferdesport im Griff zu behalten – ganz ohne Zettelchaos. Lass uns
      dein Profil einrichten, das dauert nur eine Minute.</div>
    <div class="onb-spacer"></div>
    <button class="btn btn-gold btn-block" onclick="Onb.next()">Los geht's</button>
  `;
};
Onb.stepName = function(){
  return `
    <div class="onb-helper">🧑‍🌾</div>
    ${Onb.progress(5)}
    <div class="onb-title">Wie heißt du?</div>
    <div class="onb-bubble">Damit ich dich richtig begrüßen kann.</div>
    <div class="onb-field"><input id="onb-name" placeholder="Dein Name" value="${esc(Onb.name)}"></div>
    <div class="onb-spacer"></div>
    <div class="onb-actions">
      <button class="btn btn-ghost" onclick="Onb.back()">Zurück</button>
      <button class="btn btn-gold btn-block" onclick="Onb.saveName()">Weiter</button>
    </div>
  `;
};
Onb.stepHorse = function(){
  return `
    <div class="onb-helper">🧑‍🌾</div>
    ${Onb.progress(5)}
    <div class="onb-title">Hast du ein Pferd?</div>
    <div class="onb-bubble">Leg gleich dein erstes Pferd an – Fotos und Details kannst du jederzeit später ergänzen.</div>
    <div class="onb-field"><input id="onb-horse" placeholder="Name deines Pferds" value="${esc(Onb.horseName)}"></div>
    <div class="onb-spacer"></div>
    <div class="onb-actions">
      <button class="btn btn-ghost" onclick="Onb.back()">Zurück</button>
      <button class="btn btn-gold btn-block" onclick="Onb.saveHorse()">Weiter</button>
    </div>
    <div class="onb-skip" onclick="Onb.next()">Später hinzufügen</div>
  `;
};
Onb.stepTour = function(){
  return `
    <div class="onb-helper">🧑‍🌾</div>
    ${Onb.progress(5)}
    <div class="onb-title">Das erwartet dich</div>
    <ul class="onb-list">
      <li><span class="oi">🏇</span> <div><b>Training</b> – für dich und dein Pferd, inkl. Reithallen-Planer</div></li>
      <li><span class="oi">🩺</span> <div><b>Terminplanung</b> – Termine & Fütterung im Kalender</div></li>
      <li><span class="oi">💶</span> <div><b>Kosten</b> – mit Leitfaden für alle Grundausgaben</div></li>
      <li><span class="oi">📇</span> <div><b>Kontakte</b> – Stall, Ärzte & Co. griffbereit</div></li>
      <li><span class="oi">🏆</span> <div><b>Meine Turniere</b> – Turniertagebuch mit Fotos</div></li>
      <li><span class="oi">🎯</span> <div><b>Tages-Quiz</b> – 5 Fragen täglich, macht schlauer</div></li>
    </ul>
    <div class="onb-bubble">Am wichtigsten: <b>Dein Reitertraining</b> nicht vergessen – mindestens 2× die Woche,
      dafür erinnere ich dich immer wieder auf der Startseite!</div>
    <div class="onb-spacer"></div>
    <button class="btn btn-gold btn-block" onclick="Onb.next()">Weiter</button>
  `;
};
Onb.stepStorage = function(){
  return `
    <div class="onb-helper">🧑‍🌾</div>
    ${Onb.progress(5)}
    <div class="onb-title">Ganz wichtig zum Schluss</div>
    <div class="onb-bubble">Deine Daten liegen <b>ausschließlich auf diesem Handy</b> – nirgends sonst. Das ist gut
      für deinen Datenschutz, heißt aber auch: Wird die App gelöscht oder wechselst du dein Handy, sind die
      Daten sonst unwiederbringlich weg.</div>
    <div class="onb-bubble"><b>Erstelle deshalb regelmäßig eine Sicherung</b> – du findest die Funktion jederzeit
      unten im Bereich "Impressum & Kontakt" unter "Daten sichern & wiederherstellen". Ich erinnere dich hier
      auf der Startseite auch von Zeit zu Zeit daran.</div>
    <div class="onb-spacer"></div>
    <button class="btn btn-gold btn-block" onclick="Onb.finish()">Verstanden, los geht's!</button>
  `;
};
Onb.next = function(){ Onb.step++; Onb.render(); };
Onb.back = function(){ Onb.step--; Onb.render(); };
Onb.saveName = function(){
  const v = document.getElementById('onb-name').value.trim();
  Onb.name = v; S.profile.name = v || 'Reiter'; Onb.next();
};
Onb.saveHorse = function(){
  const v = document.getElementById('onb-horse').value.trim();
  Onb.horseName = v;
  if(v) S.horses.push({id:uid(), name:v, type:'', age:'', notes:'', photo:null});
  Onb.next();
};
Onb.finish = function(){
  S.onboarded = true; saveState();
  document.getElementById('onboarding').classList.add('hidden');
  Nav.go('home');
};

/* ============================= INIT ============================= */
(async function init(){
  await loadState();
  if(!S.onboarded){ Onb.render(); }
  else{ Nav.go('home'); }
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.log('Service Worker nicht registriert:', e));
  });
}
</script>
</body>
